buildscript {
    ext {
        buildToolsVersion = "34.0.0"
        minSdkVersion = 23
        compileSdkVersion = 34
        targetSdkVersion = 34
        ndkVersion = "25.1.8937393"
        kotlinVersion = "1.9.22"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.2.2")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
    }
}

// Force react-native -> react-android for libraries like react-native-screens
// Pin react-android to the same version as our RN (0.73.6)
final def REACT_NATIVE_VERSION = "0.73.6"
subprojects { subproject ->
    afterEvaluate {
        if (subproject.plugins.hasPlugin("com.android.application") ||
            subproject.plugins.hasPlugin("com.android.library")) {
            subproject.configurations.all {
                resolutionStrategy.eachDependency { details ->
                    if (details.requested.group == 'com.facebook.react' &&
                        details.requested.name == 'react-native') {
                        details.useTarget(
                            group: details.requested.group,
                            name: 'react-android',
                            version: REACT_NATIVE_VERSION
                        )
                    }
                }
            }
            // Fix JVM target compatibility for Kotlin libraries
            subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach { task ->
                if (task.name.contains("compile")) {
                    task.kotlinOptions {
                        jvmTarget = "1.8"
                    }
                }
            }
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url("https://www.jitpack.io") }
        maven { url("${project.rootDir}/../node_modules/react-native/android") }
        maven { url("${project.rootDir}/../node_modules/jsc-android/dist") }
    }

    // Fix missing namespace and BuildConfig for old library modules
    afterEvaluate { project ->
        if (project.hasProperty("android")) {
            def androidExt = project.extensions.findByName("android")
            if (androidExt != null) {
                if (androidExt.namespace == null) {
                    def manifest = project.file("src/main/AndroidManifest.xml")
                    if (manifest.exists()) {
                        def manifestText = manifest.text
                        def packageMatch = manifestText =~ /package="([^"]+)"/
                        if (packageMatch.find()) {
                            androidExt.namespace = packageMatch.group(1)
                        }
                    }
                }
                if (androidExt.hasProperty("buildFeatures")) {
                    androidExt.buildFeatures.buildConfig = true
                }
            }
        }
    }
}
